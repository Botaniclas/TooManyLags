[09 - AI Mob Ownership]

## Use the mob's active player target for FGN ownership. Requires two eligible nearby players. Attacks block transfers and retry after attack end. Install the same version on server and clients; restart required.
# Setting type: Boolean
# Default value: true
EnableAIOwnership = true

## Target ping limit in milliseconds for server fallback. Requires FGN SSS and another eligible player within ServerFallbackRadius. 0: target ping must exceed the best other candidate by 250 ms. Server setting.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 2000
ServerFallbackPingMs = 200

## Distance in metres to another eligible FGN candidate for high-ping server fallback. The candidate's 3x3-sector scan must include the mob. Server setting.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 100
ServerFallbackRadius = 6

