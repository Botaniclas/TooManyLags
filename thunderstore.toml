[config]
schemaVersion = "0.0.1"

[package]
namespace = "Botaniclas"
name = "TooManyLags_FGN_Addon"
versionNumber = "1.0.26"
description = "FiresGhettoNetworking addon aiming for no noticeable latency for every player whenever possible, and the lowest possible latency otherwise. Dynamic object and mob ownership completely removes the impact of other players' lag."
websiteUrl = "https://github.com/Botaniclas/TooManyLags"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
VerdantsAscent-FiresGhettoNetworking = "1.5.36"

[build]
icon = "./icon.png"
readme = "./README-Thunderstore.md"
outdir = "./outputs"

[[build.copy]]
source = "./bin/TooManyLags.dll"
target = "TooManyLags.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "tweaks", "server-side", "client-side", "ai-generated"]
