[08 - Camera Heading]

## Server only; live console supported. Camera check interval in seconds, sent to all clients on join and when changed by console. Client config value is ignored. Minimum 0.05 allows up to 20 checks per second. Only sector changes update player data. Server grid timing is set in section 04.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0,05 to 5
CameraHeadingCheckIntervalSeconds = 0.1

[09 - AI Mob Ownership]

## Server and all clients; use the same value; restart required. Use the mob's active player target for FiresGhettoNetworking ownership. Requires two eligible nearby players. Attacks block transfers and retry after attack end. Install the same version on server and clients.
# Setting type: Boolean
# Default value: true
EnableAIOwnership = true

## Server only; live console supported. Target ping limit in milliseconds for server fallback with Server-Side Simulation, or a lower-latency nearby player with NoServerSideSimulation=true. Requires another eligible FiresGhettoNetworking player within ServerFallbackRadius. 0: target ping must exceed the best other candidate by 250 ms.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 2000
ServerFallbackPingMs = 200

## Server only; live console supported. Distance in metres to another eligible FiresGhettoNetworking player for high-ping fallback. With Server-Side Simulation the server takes over; otherwise a lower-latency nearby player. The candidate must have the mob in its active area.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 100
ServerFallbackRadius = 6

