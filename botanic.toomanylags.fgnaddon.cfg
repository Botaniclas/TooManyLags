## Settings file was created by plugin TooManyLags - FiresGhettoNetworking Addon v1.0.10
## Plugin GUID: botanic.toomanylags.fgnaddon

[01 - General]

## Server and each client; restart required. Enable TooManyLags on this installation. Required FiresGhettoNetworking settings are applied for this session.
# Setting type: Boolean
# Default value: true
Enabled = true

## Server only; restart required. Recommended for dedicated servers with a weak or already overloaded CPU. true: disable FiresGhettoNetworking Server-Side Simulation and keep simulation on players; shared fields prefer the player with lower latency. Functionality is limited: no server ownership, and server-owned building/default/refill options are ignored. false: full Server-Side Simulation mode.
# Setting type: Boolean
# Default value: false
NoServerSideSimulation = false

## Local to this server/client. Live console: tml_config EnableLogs true/false. Enable extra diagnostic messages. Startup failures are always reported.
# Setting type: Boolean
# Default value: false
EnableLogs = false

[02 - Static Buildings]

## Server only; restart required. Keep eligible non-interactive building pieces server-owned. Independent of the interactive grid. Ignored with NoServerSideSimulation=true.
# Setting type: Boolean
# Default value: false
ServerOwnedStaticBuildings = false

[03 - Default Ownership and Overrides]

## Server only; restart required. true: server default outside player coverage, with grid transfers nearby. false: vanilla ownership when players are alone or far apart. KeepOwnershipOnCellExit preserves ownership after a field is vacated. Ignored with NoServerSideSimulation=true.
# Setting type: Boolean
# Default value: false
ServerOwnedInteractivesByDefault = false

## Server only; restart required. Keep enabled refill stations server-owned, even inside player fields: smelters, cooking/fire stations, fermenters, shield generators and turrets. false: grid rules with 10 seconds of protection after observed refilling. Ignored with NoServerSideSimulation=true.
# Setting type: Boolean
# Default value: false
ServerOwnedRefillStations = false

[04 - Grid Settings]

## Server only; restart required. Cell size in metres: 4, 8 or 16. 4 metres requires Rounded5x5/Rounded7x7. Does not change vanilla/PUP loading distances.
# Setting type: Int32
# Default value: 4
# Acceptable values: 4, 8, 16
GridCellSizeMeters = 4

## Server only; restart required. Base shape: Square3x3 is square; Rounded5x5/Rounded7x7 are rounded. Directional mode omits central and far rear fields. Overlaps use the server, or a lower-latency player with NoServerSideSimulation=true.
# Setting type: String
# Default value: Rounded7x7
# Acceptable values: Rounded5x5, Rounded7x7
GridCoveragePattern = Rounded7x7

## Server only; live console supported. Check interval in seconds for cell changes and, in directional mode, changes between eight 45-degree heading sectors. Only changes request fields. Existing timers/handoffs also progress while standing.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0,1 to 5
MovementRotationCheckIntervalSeconds = 0.1

## Server only; restart required. true: keep ownership after everyone leaves. In directional mode, when one player remains, only red fields transfer automatically; orange/yellow wait for that player's next cell/heading change. Completed player fields are cached until relevant changes/unloading. false: normal departure transfers, no cache. Native release and pinned stations still apply.
# Setting type: Boolean
# Default value: true
KeepOwnershipOnCellExit = true

[05 - Directional Grid Mode]

## Server only; restart required. true: camera-directed grid with the three timers below. false: full grid from section 06. Clients publish their camera's eight heading sectors. Missing camera data falls back to character heading. Stationary players still count towards overlaps.
# Setting type: Boolean
# Default value: true
DirectionalGridMode = true

## Server only; live console supported. Red: six inner fields, your three-cell row and the row ahead. Delay in seconds for new requests; 0 allowed. Handoff protection remains active.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 30
InnerTransitionDelaySeconds = 0

## Server only; live console supported. Orange: one extra three-cell row ahead of red. Active only with 4-metre cells and Rounded5x5/Rounded7x7. Delay in seconds for new requests; 0 allowed. The farthest 7x7 row stays yellow.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 30
ForwardTransitionDelaySeconds = 0.2

## Server only; live console supported. Yellow: remaining active fields. Delay in seconds for new requests. White rear fields make no request. Overlaps use the earliest still-valid request deadline.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 30
OuterTransitionDelaySeconds = 3

[06 - Full Grid Mode]

## Server only; live console supported. Only with DirectionalGridMode=false: one delay in seconds for new full-grid requests. Active use and safe handoffs may require more time.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 30
TransitionDelaySeconds = 2

