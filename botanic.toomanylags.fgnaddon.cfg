[00 - Simulation Settings - Interactive Objects]

## Server only; restart required. Simulation settings and exit retention only distribute CPU load between server and clients. They do not affect perceived latency. true: server default for managed interactions/idle tamed animals; false: vanilla default. Requires Server-Side Simulation.
# Setting type: Boolean
# Default value: false
ServerOwnedInteractivesByDefault = false

[00 - Simulation Settings - Static Objects]

## Server only; restart required. true: server default for eligible non-interactive building pieces; false: vanilla default. UseGridForStaticBuildings lets nearby clients share their simulation. Requires Server-Side Simulation.
# Setting type: Boolean
# Default value: false
ServerOwnedStaticBuildingsByDefault = false

## Server only; restart required. Include eligible static building pieces in the existing grid. Overlaps use the server; empty fields follow KeepOwnershipOnCellExit. PUP FPS is optional; baked clusters are excluded. Requires Server-Side Simulation.
# Setting type: Boolean
# Default value: false
UseGridForStaticBuildings = false

[01 - General]

## Server only; restart required. Enable TooManyLags for this server session. Clients follow the server; their local value is ignored. Handoff safeguards are always active with Server-Side Simulation. Later sections contain tuned defaults; adjust only when needed.
# Setting type: Boolean
# Default value: true
Enabled = true

## Server only; restart required. Recommended for dedicated servers with a weak or already overloaded CPU. true: disable FiresGhettoNetworking Server-Side Simulation and keep simulation on players; shared fields prefer the player with lower latency. Functionality is limited: no server ownership, and server-owned building/default/refill options are ignored. false: full Server-Side Simulation mode.
# Setting type: Boolean
# Default value: false
NoServerSideSimulation = false

## Local to this server/client. Live console: tml_config EnableLogs true/false. Enable extra diagnostic messages. Startup failures are always reported.
# Setting type: Boolean
# Default value: false
EnableLogs = false

## Server only; restart required. true: keep vacated fields, gradually sharing CPU load between clients/server. false: return to server defaults; requires Server-Side Simulation and an interactive/static server default. false also keeps the full directional footprint. Native region release still applies.
# Setting type: Boolean
# Default value: true
KeepOwnershipOnCellExit = true

[03 - Default Ownership and Overrides]

## Server only; restart required. Keep enabled refill stations server-owned, even inside player fields: smelters, cooking/fire stations, fermenters, shield generators and turrets. false: grid rules with 10 seconds of protection after observed refilling. Ignored with NoServerSideSimulation=true.
# Setting type: Boolean
# Default value: false
ServerOwnedRefillStations = false

## Server only; restart required. Give idle tamed animals a server default outside player fields, even when the interactive default is off. Hostile Mobs without a player target use guarded server handoffs (requires EnableAIOwnership); player targets keep normal target ownership. Friendly magic summons, bosses and active riding/following stay excluded. Requires Server-Side Simulation; can increase server CPU usage.
# Setting type: Boolean
# Default value: false
ServerOwnedMobsByDefault = false

[04 - Grid Settings]

## Server only; restart required. Defaults should work well. Larger grids are recommended for poor connections: they give handoffs more lead time, covering more objects. Cell size in metres: 4, 6.4, 8 or 16; 4 requires a rounded grid. Does not change vanilla/PUP loading distances.
# Setting type: Single
# Default value: 4
# Acceptable values: 4, 6.4, 8, 16
GridCellSizeMeters = 4

## Server only; restart required. Base shape: Square3x3 is square; Rounded5x5/Rounded7x7 are rounded. With KeepOwnershipOnCellExit=true, directional mode omits central and far rear fields; false keeps the complete shape. Overlaps use the server, or a lower-latency player with NoServerSideSimulation=true.
# Setting type: String
# Default value: Rounded7x7
# Acceptable values: Rounded5x5, Square3x3, Rounded7x7
GridCoveragePattern = Rounded7x7

## Server only; live console supported. Check interval in seconds for movement and fallback heading. Received camera-coverage changes request an immediate pass. Only changed coverage requests fields; existing timers/handoffs also progress while standing.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.05 to 5
MovementRotationCheckIntervalSeconds = 0.05

[05 - Directional Grid Mode]

## Server only; restart required. true: camera-directed grid with the timers below and the overlap angle in section 08. false: full grid from section 06. Missing camera data uses character heading. Stationary players still count.
# Setting type: Boolean
# Default value: true
DirectionalGridMode = true

## Server only; live console supported. Red: six inner fields with KeepOwnershipOnCellExit=true; a full 3x3 centre with false. Delay in seconds for new requests; 0 allowed. Handoff protection remains active.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 30
InnerTransitionDelaySeconds = 0

## Server only; live console supported. Orange: one extra three-cell row ahead of red. Active only with 4-metre cells and Rounded5x5/Rounded7x7. Delay in seconds for new requests; 0 allowed. The farthest 7x7 row stays yellow.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 30
ForwardTransitionDelaySeconds = 0.2

## Server only; live console supported. Yellow: remaining active fields. Delay in seconds for new requests. With KeepOwnershipOnCellExit=true, white rear fields make no request; false covers the full shape. Overlaps use the earliest still-valid request deadline.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 30
OuterTransitionDelaySeconds = 3

## Server only; live console supported. After a directional-grid overlap assigns a field to the server, ignore new grid ownership decisions for this many seconds. Expiry alone causes no transfer; the next movement/heading update can request the field again. 0 disables. Empty fields/native release and usage protection remain unchanged. Ignored without Server-Side Simulation. New cooldowns use the updated value.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 30
ServerOverlapCooldownSeconds = 1

[06 - Full Grid Mode]

## Server only; live console supported. Only with DirectionalGridMode=false: one delay in seconds for new full-grid requests. Active use and safe handoffs may require more time.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 30
TransitionDelaySeconds = 2

[08 - Camera Heading]

## Server only; live console supported. Camera check interval in seconds, sent to all clients. Client value is ignored. 0.05 allows up to 20 checks per second; only coverage changes are sent. Server grid timing is in section 04.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.05 to 5
CameraHeadingCheckIntervalSeconds = 0.05

## Server only; live console supported. Base angular overlap of adjacent directions, sent to clients. 0: one base direction; 30: default; 45: two. Rotation prediction can add one direction. Character-heading fallback uses the same angle.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 45
CameraDirectionOverlapDegrees = 30

## Server only; live console supported. Predict camera rotation this many seconds ahead. Adds at most one adjacent direction; new fields use the inner/red delay. Keeps current coverage and handoff protection. 0 disables. Requires updated clients; character fallback is unchanged.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 0.5
CameraRotationPredictionSeconds = 0.1

[09 - AI Mob Ownership]

## Server only; restart required. Enable target-based Hostile Mob ownership. Clients follow the server; their local value is ignored. Attacks block transfers until attack end.
# Setting type: Boolean
# Default value: true
EnableAIOwnership = true

## Server only; restart required. On a boss player-target change, use server ownership if at least two living players are within BossPlayerRadius. Otherwise bosses follow normal Hostile Mob target rules. Requires EnableAIOwnership and Server-Side Simulation for server ownership. No continuous radius checks; unchanged targets keep their last decision.
# Setting type: Boolean
# Default value: true
BossAlwaysServerOwned = true

## Server only; restart required. Player distance from the boss in metres for BossAlwaysServerOwned. Evaluated on player-target acquisition, change or loss, not movement.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 100
BossPlayerRadius = 30

## Server only; live console supported. Target ping limit in milliseconds for server fallback with Server-Side Simulation, or a lower-latency nearby player with NoServerSideSimulation=true. Requires another eligible FiresGhettoNetworking player within ServerFallbackRadius. 0: target ping must exceed the best other candidate by 250 ms.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 2000
ServerFallbackPingMs = 200

## Server only; live console supported. Distance in metres to another eligible FiresGhettoNetworking player for high-ping fallback. With Server-Side Simulation the server takes over; otherwise a lower-latency nearby player. The candidate must have the mob in its active area.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 100
ServerFallbackRadius = 6

