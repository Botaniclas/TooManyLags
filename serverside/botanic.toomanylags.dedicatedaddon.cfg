## Settings file was created by plugin TooManyLags - Server Side v0.13.2
## Plugin GUID: botanic.toomanylags.dedicatedaddon

[00 - General]

## Server only. Restart required. Enable this experimental addon; Dedicated Simulation must be active. Public chests, boats and idle carts use guarded grid ownership and native inventory opening. Editing and unsupported custom actions stay native.
# Setting type: Boolean
# Default value: true
Enabled = true

[00 - Simulation Settings]

## Server only. Restart required. False keeps enabled eligible static building pieces on the server. True lets the normal grid share them with nearby players. Server-owned buildings can increase server CPU load. Does not add PUP collision support.
# Setting type: Boolean
# Default value: false
UseGridForStaticBuildings = false

[01 - Grid]

## Server only. Restart required. False returns managed objects outside player fields to server simulation. True retains vacated ownership. Nearby pickup owners/requesters stay protected; live fish retain native pickup priority. Native region releases remain unchanged. Both modes keep the full rear grid.
# Setting type: Boolean
# Default value: false
KeepOwnershipOnCellExit = false

## Server only. Restart required. Cell size in metres. Four metres requires a rounded pattern.
# Setting type: Single
# Default value: 4
# Acceptable values: 4, 6.4, 8, 16
GridCellSizeMeters = 4

## Server only. Restart required. Player coverage shape.
# Setting type: GridCoveragePattern
# Default value: Rounded7x7
# Acceptable values: Square3x3, Rounded5x5, Rounded7x7
GridCoveragePattern = Rounded7x7

## Server only. Restart required. Check character cell and direction. Unchanged coverage creates no field/object updates. No camera data is available from vanilla clients.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.05 to 5
MovementRotationCheckIntervalSeconds = 0.1

## Server only. Restart required. Directional mode: expand poor-connection coverage to four red rows (3/5/5/3 cells) plus three orange cells. Ping is cached for one second. Shrinks below 75% of this threshold to avoid jitter; unknown ping retains current size. Zero disables automatic expansion.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 5000
LargeGridPingThresholdMs = 200

[02 - Direction and Delays]

## Server only. Restart required. Use character direction for the forward row. The inner 3x3 includes rear cells. False uses the full selected pattern with one uniform timer.
# Setting type: Boolean
# Default value: true
DirectionalGridMode = true

## Server only. Restart required. Include yellow outer cells in directional mode. False keeps only the red 3x3 and, with rounded patterns, the orange forward row. Does not affect full-grid mode.
# Setting type: Boolean
# Default value: false
EnableOuterCells = false

## Server only. Restart required. Horizontal native player speed at which orange cells use 0 seconds. Returns to the configured orange delay below 75% of this speed (default: below 3 m/s), preventing threshold jitter. Zero disables the speed override. No extra network messages.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 30
FastMovementThresholdMetersPerSecond = 4

## Server only. Restart required. Seconds; 0 allowed. Red: the inner 3x3, including rear cells.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 30
InnerTransitionDelaySeconds = 0

## Server only. Restart required. Seconds; 0 allowed. Orange: one extra forward row with rounded grids. Fast movement can override this delay to 0.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 30
ForwardTransitionDelaySeconds = 0.2

## Server only. Restart required. Seconds; 0 allowed. Yellow cells when enabled; also the grid retirement delay after a cell becomes empty.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 30
OuterTransitionDelaySeconds = 3

## Server only. Restart required. Seconds; 0 allowed. Used only with the full grid.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 30
TransitionDelaySeconds = 2

## Server only. Restart required. Seconds; 0 allowed. Hold after shared cells move to the server. Zero disables. Only new movement/direction requests can take them again.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 30
ServerOverlapCooldownSeconds = 1

[03 - Handoff Protection]

## Server only. Restart required. Pending player-to-server transfers for direct-state interactions wait this many native round-trip times. Incoming source-object updates cancel that transfer. Does not delay server-to-player acquisition; cannot guarantee delivery deadlines.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
ClientToServerGracePingMultiplier = 2

## Server only. Restart required. Minimum pending-transfer window. No extra window for native Pickable completion or purely local controls. Cancelled transfers require new grid activity. Zero disables this minimum.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 5
MinimumClientToServerGraceSeconds = 0.1

## Server only. Restart required. Reject automatic transfers after an observed fuel, material, cooking-slot or ammo increase. Repeated observed inserts restart this window. Expiry does not replay a transfer; fresh grid activity is required. Remote local actions are visible only after native replication. Zero disables this additional window.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
RefillOwnershipProtectionSeconds = 1

[04 - Backend Compatibility]

## Server only. Restart required. True keeps FireControl sources outside the grid. False lets enabled, eligible refill/fireplace objects use normal grid ownership and handoff protection; FireControl will not reclaim those objects. Other fires keep their backend policy. Server-only FireControl rules cannot be fully enforced on player-owned sources.
# Setting type: Boolean
# Default value: true
RespectBackendFireOwnership = true

[05 - Hostile Mobs]

## Server only. Restart required. Cone distance for ordinary Hostile Mobs in overlapping player fields; bosses use BossMobConeRangeMeters. Cone width is 90 degrees (45 each side). Player selection follows the setting below; no eligible player means server ownership. Attack guards remain active; the mob's actual target is unchanged.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 1 to 64
HostileMobConeRangeMeters = 8

## Server only. Restart required. Cone distance for creatures marked as bosses by Valheim's native IsBoss flag. Uses the same angle, player-selection rules and attack guards as ordinary Hostile Mobs.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 64
BossMobConeRangeMeters = 10

## Server only. Restart required. In overlapping fields, use the server when more than one living, eligible player is in the mob's cone. One player gets ownership; none uses the server. False always selects the nearest eligible cone player. Existing attack guards still apply.
# Setting type: Boolean
# Default value: true
ServerOwnedWhenMultiplePlayersInMobCone = true

## Server only. Restart required. Experimental additional handoff veto for player-owned Hostile Mobs. Native ability signals update cooldown timestamps; subtracts 0.1 seconds plus cached round-trip latency. Ready attacks use 5 degrees extra on each side and 0.5 metres extra range. Unknown/ambiguous abilities count as ready. Geometry runs only for a pending handoff after existing attack guards; blocked predictions wait for relevant events. No duplicate AI or client mod; observations are not an atomic safety guarantee.
# Setting type: Boolean
# Default value: true
EnableMobAttackForecast = true

[09 - Solo Mob Test]

## Server only. Restart required. Diagnostic test, not normal gameplay. With exactly one online player, selects one nearby grid-covered Hostile Mob within 20 metres and alternates requests between player and server. All normal attack/forecast/readiness guards remain active. Waits for each successful handoff before reversing. Stops on death, unload, departure, a second accepted player or after five minutes. Writes test events to the server log. Disable and restart after testing.
# Setting type: Boolean
# Default value: false
EnableMobOwnershipTest = false

## Server only. Restart required. Minimum pause after a successful test handoff before requesting the opposite owner. Blocked requests wait for normal safeguards, without reversing or repeatedly issuing new requests. Only used when EnableMobOwnershipTest=true.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 10
MobOwnershipTestIntervalSeconds = 1

