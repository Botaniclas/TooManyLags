[config]
schemaVersion = "0.0.1"

[package]
namespace = "Botaniclas"
name = "TooManyLags_FGN_Addon"
versionNumber = "1.0.50"
description = "Leave connection lag behind. Go beyond Server-Side Simulation with this FiresGhettoNetworking addon: local interactions and smarter Hostile Mob ownership. Install, play, and never look back."
websiteUrl = "https://github.com/Botaniclas/TooManyLags"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
VerdantsAscent-FiresGhettoNetworking = "1.5.36"

[build]
icon = "./icon.png"
readme = "./README-Thunderstore.md"
outdir = "./outputs"

[[build.copy]]
source = "./bin/TooManyLags.dll"
target = "TooManyLags.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "tweaks", "utility", "server-side", "client-side", "ai-generated"]
