<title id="title">TooManyLags: the three transition timers</title><desc id="desc">Default north-facing 4-metre Rounded7x7 directional grid with ownership retention enabled: six inner red cells wait zero seconds, three forward orange cells wait 0.2 seconds, seventeen outer yellow cells wait three seconds. Eleven white rear cells make no new ownership request. A green marker shows the player and camera direction.</desc>
