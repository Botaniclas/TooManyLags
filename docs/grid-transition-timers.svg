<text x="807" y="763" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526072">Existing ownership is retained.</text>
<line x1="68" y1="808" x2="1248" y2="808" stroke="#DFE4EB" stroke-width="1" stroke-linecap="round"/>
<text x="68" y="846" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#253344">Each tile is 4 x 4 metres. Timings are configurable.</text>
<text x="68" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#526072">Loading, open inventories and active use can still delay a handoff.</text>
<text x="68" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526072">Straight-ahead example; angular overlap and turning prediction can extend this layout.</text>
