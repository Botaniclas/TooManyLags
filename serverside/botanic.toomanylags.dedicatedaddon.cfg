## Grid-manage public stationary chests. Nearby players acquire them automatically; shared or vacated fields use the server. Taking an available player's chest uses its native open-inventory check. Boat/cart cargo uses its own category; private chests, graves, incinerators and custom inventory controls stay native.
# Setting type: Boolean
# Default value: true
Containers = true

## Grid-manage native boats at their helm position. A sole nearby player owns the boat; overlapping fields use the server, including while steering. Open cargo blocks handoffs, even outside helm coverage. Blocked overlaps retry on the existing two-second boat timer; settled boats do not query cargo again. Unsupported/custom boats keep native handling.
# Setting type: Boolean
# Default value: true
Ships = true

## Grid-manage idle native carts. Native cargo and pulling checks block handoffs, including outside player fields. Remote hitch requests keep priority until observed attachment, native refusal or departure. Detaching resumes the grid; no extra cart polling timer. Unsupported carts keep native handling.
# Setting type: Boolean
# Default value: true
Carts = true

## Experimental grid ownership for untamed native MonsterAI/Humanoid creatures. Solo fields use that player; overlaps use the forward-cone rules in section 05. Transfers wait for attack completion. Remote attack observation is delayed and is not an atomic client acknowledgement. Friendly player summons and custom AI retain native handling.
# Setting type: Boolean
# Default value: true
HostileMobs = true

