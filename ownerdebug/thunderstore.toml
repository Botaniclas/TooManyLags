[config]
schemaVersion = "0.0.1"

[package]
namespace = "Botaniclas"
name = "BotanicOwnerDebug"
versionNumber = "1.0.10"
description = "See who owns buildings, dropped items and mobs to debug and configure ownership mods. F10 cycles mobs only, mobs and interactive objects, all buildings, dropped items and mobs, then off. Includes owner colours and a live player legend."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./outputs"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "tools", "client-side", "ai-generated"]
